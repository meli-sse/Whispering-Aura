<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>contact page</title>
    <link rel="stylesheet" href="../styles/contact.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

    <div id="navbar-container"></div>
    <script src="../javaScript/navbar.js"></script>

<main class="container">

    <!-- FORM -->
    <section class="form-section glass">
        <h2>💌 Contactez-nous</h2>

        <form id="contactForm">

            <input type="text" id="nom" placeholder="Votre nom">

            <div class="row">
                <input type="email" id="email" placeholder="Votre email">
                <input type="text" id="phone" placeholder="Téléphone">
            </div>

            <textarea id="message" placeholder="Votre message..."></textarea>

            <button type="submit"> Envoyer ✨ </button>
        </form>

            <p id="successMessage"></p>
        
        </section>

    <!-- INFOS -->
    <section class="info-section">
        <h1>Contact <span>Us</span> 💖</h1>

        <p>
            Découvrez l’univers parfumé de Whispering AURA 🌸  
            Contactez-nous pour toute question ou collaboration.
        </p>

        <div class="info">📞 +213 550 12 34 56</div>
        <div class="info">📧 contact@whisperingaura.com</div>
        <div class="info">📍 Alger, Algérie</div>

    </section>

</main>

<!-- papillons -->
<div class="butterfly b1">🦋</div>
<div class="butterfly b2">🦋</div>
<div class="butterfly b3">🦋</div>

<script src="../javaScript/contact.js"></script>

</body>
</html>
